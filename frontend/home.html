    <script>

const userEmail = localStorage.getItem("email");

if (!userEmail) {

}


  function fetchBudget() {
    fetch(`http://localhost:3000/api/budget/${userEmail}`)
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to fetch budget");
        }
        return response.json();
      })
      .then(data => {
        const budget = data.budget_amount ?? 0;
        document.getElementById('budget-status').textContent = `₹${budget}`;
      })
      .catch(error => {
        console.error("Error fetching budget:", error);
        document.getElementById('budget-status').textContent = "Error loading budget";
      });
  }

// Fetch expenses from backend
function fetchExpenses() {
    fetch(`http://localhost:3000/api/expenses/time/${userEmail}`)

            updateExpenseTable();

// Call fetchData when the script loads
//fetchData();
async function addExpense() {
    const email = localStorage.getItem("email");
    const amount = document.getElementById("expense-amount").value;
    const title = document.getElementById("expense-title").value;
    const category = document.getElementById("expense-category").value;
    const expenseDate = document.getElementById("expense-date").value;

    if (!email || !amount || !title || !category || !expenseDate) {
        alert("Please fill all fields!");
        return;
    }

    const expenseData = {
        email,
        title,
        category,
        amount: parseFloat(amount),
        expense_date: expenseDate
    };

    try {
        const response = await fetch("http://localhost:3000/api/add-expense", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(expenseData)
        });

        const result = await response.json();
        alert(result.message);

        if (result.success) {
            await fetchData(); // Refresh expenses and charts after adding expense
        }
    } catch (error) {
        console.error("Error adding expense:", error);
        alert("Failed to add expense!");
    }
}

let expensesMap = {}; // Global object to store expenses

async function fetchExpenses() {
    const userEmail = localStorage.getItem("email");

    if (!userEmail) {
        alert("User not logged in!");
        return;
    }

    try {
        const response = await fetch(`http://localhost:3000/api/expenses/${userEmail}`);
        const data = await response.json();

        expensesMap = {}; // Reset expensesMap
        data.forEach(expense => {
            if (!expensesMap[expense.category]) {
                expensesMap[expense.category] = [];
            }
            expensesMap[expense.category].push(expense);
        });

        displayExpenses(data);
    } catch (error) {
        console.error("Error fetching expenses:", error);
    }
}

function displayExpenses(expenses) {
    const tableBody = document.getElementById("expense-table-body");
    tableBody.innerHTML = ""; // Clear previous entries

    expenses.forEach(expense => {
        const row = `
            <tr>
                <td>${new Date(expense.expense_date).toLocaleDateString()}</td>
                <td>${expense.title}</td>
                <td>${expense.category}</td>
                <td>$${expense.amount.toFixed(2)}</td>
                <td>
                    <button onclick="deleteExpense(${expense.id})" style="
                        background-color: #e74c3c;
                        color: white;
                        border: none;
                        padding: 5px 10px;
                        border-radius: 4px;
                        cursor: pointer;
                    ">Delete</button>
                </td>
            </tr>
        `;
        tableBody.innerHTML += row;
    });

    console.log(expensesMap); // Assuming you have this defined elsewhere
}




function generatePieChart() {
    if (Object.keys(expensesMap).length === 0) {
        console.warn("No expenses found for pie chart.");
        return;
    }

    const categoryTotals = {};

    // Sum amounts per category
    Object.keys(expensesMap).forEach(category => {
        categoryTotals[category] = expensesMap[category].reduce((sum, expense) => sum + parseFloat(expense.amount), 0);
    });

    const ctx = document.getElementById("pieChart").getContext("2d");

    // Check and destroy previous chart instance
    if (window.pieChart instanceof Chart) {
        window.pieChart.destroy();
    }

    window.pieChart = new Chart(ctx, {
        type: "pie",
        data: {
            labels: Object.keys(categoryTotals),
            datasets: [{
                data: Object.values(categoryTotals),
                backgroundColor: ["#FF6384", "#36A2EB", "#FFCE56", "#4CAF50", "#9C27B0"]
            }]
        }
    });
}

function generateLineChart() {
    if (Object.keys(expensesMap).length === 0) {
        console.warn("No expenses found for line chart.");
        return;
    }

    const dailyTotals = {};

    // Sum amounts per date
    Object.values(expensesMap).flat().forEach(expense => {
        const date = new Date(expense.expense_date).toISOString().split("T")[0]; // Format as YYYY-MM-DD
        dailyTotals[date] = (dailyTotals[date] || 0) + parseFloat(expense.amount);
    });

    // Sort dates in ascending order
    const sortedDates = Object.keys(dailyTotals).sort((a, b) => new Date(a) - new Date(b));

    const ctx = document.getElementById("lineChart").getContext("2d");

    // Check and destroy previous chart instance
    if (window.lineChart instanceof Chart) {
        window.lineChart.destroy();
    }

    window.lineChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: sortedDates,
            datasets: [{
                label: "Amount Spent Over Time",
                data: sortedDates.map(date => dailyTotals[date]),
                borderColor: "#36A2EB",
                fill: false,
                tension: 0.3
            }]
        }
    });
}

// Ensure expenses are loaded before calling chart functions
function updateCharts() {
    setTimeout(() => {
        generatePieChart();
        generateLineChart();
    }, 500); // Delay to ensure data is ready
}

 function deleteExpense(id) {
    if (!confirm("Are you sure you want to delete this expense?")) return;

    fetch(`http://localhost:3000/api/delete-expense/${id}`, {

        } else {

        }
      })

      });
  }
